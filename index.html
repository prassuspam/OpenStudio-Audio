<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>OpenStudio Audio — Multitrack Editor</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#181a1f;--panel2:#202329;--line:#30343c;--text:#f1f2f4;--muted:#9298a3;--accent:#b9a7ff;--mint:#9cdbb8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{background:#24272e;border:1px solid #383d47;color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer}button:hover{border-color:#8176a9;background:#2b2d36}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);border-color:var(--accent);color:#181421;font-weight:750}.primary:hover{background:#c9bdff}.app{height:100vh;min-height:540px;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #2b2e35;gap:16px;flex:none}.brand{font-size:14px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}.logo{width:29px;height:29px;border-radius:9px;background:var(--accent);color:#181421;display:grid;place-items:center;font-size:18px}.top small{font-size:10px;color:var(--muted);font-weight:500;margin-left:3px}.topspace{flex:1}.local{color:var(--muted);font-size:10px;letter-spacing:1px}.toolbar{height:58px;display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid #2b2e35;flex:none}.toolgroup{display:flex;align-items:center;gap:6px;padding-right:12px;border-right:1px solid #343841}.toolgroup:last-child{border:0}.tool-label{font-size:10px;color:var(--muted);margin-right:4px}.zoom{width:110px;accent-color:var(--accent)}.workspace{display:flex;flex:1;min-height:0;flex-direction:column}.timeline-shell{display:flex;flex:1;min-height:0;overflow:hidden}.track-sidebar{width:190px;flex:none;background:#17191e;border-right:1px solid var(--line);overflow:hidden}.sidebar-head{height:38px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;color:var(--muted);font-size:10px;letter-spacing:1px}.track-label{height:104px;border-bottom:1px solid #30343c;padding:13px 11px;position:relative}.track-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 5px}.track-sub{font-size:10px;color:var(--muted)}.track-actions{display:flex;gap:4px;margin-top:9px}.track-actions button{padding:3px 7px;font-size:10px}.timeline-scroll{flex:1;overflow:auto;position:relative;background:#121419;touch-action:pan-x pan-y}.timeline-inner{position:relative;min-height:100%;width:1800px}.ruler{height:38px;position:sticky;top:0;z-index:5;background:#191b21;border-bottom:1px solid #343841;display:block}.tick{position:absolute;top:0;height:100%;border-left:1px solid #3a3e48;padding:5px 0 0 6px;font-size:10px;color:#9096a2}.lane{height:104px;border-bottom:1px solid #30343c;position:relative;background-image:linear-gradient(to right,#ffffff08 1px,transparent 1px);background-size:100px 100%;}.lane:nth-child(even){background-color:#ffffff03}.clip{position:absolute;top:12px;height:78px;border:1px solid #8775c7;border-radius:7px;background:#39314f;overflow:hidden;cursor:grab;min-width:14px;touch-action:none;box-shadow:0 3px 10px #0004}.clip:active{cursor:grabbing}.clip.selected{border-color:#e0d7ff;box-shadow:0 0 0 1px #b9a7ff55,0 3px 14px #0005}.clip canvas{width:100%;height:100%;display:block;opacity:.9;pointer-events:none}.clip-title{position:absolute;top:5px;left:10px;right:10px;font-size:10px;font-weight:700;color:#f3efff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #171321;pointer-events:none}.trim{position:absolute;top:0;bottom:0;width:9px;background:#c7baff;opacity:.85;cursor:ew-resize;z-index:2;touch-action:none}.trim.left{left:0;border-radius:6px 0 0 6px}.trim.right{right:0;border-radius:0 6px 6px 0}.playhead{position:absolute;top:0;bottom:0;width:1px;background:#f7f4ff;z-index:7;pointer-events:none;box-shadow:0 0 5px #fff8}.playhead:before{content:"";position:absolute;top:0;left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #f7f4ff}.dropzone{margin:20px;border:1px dashed #555965;border-radius:12px;padding:40px 18px;text-align:center;color:var(--muted)}.dropzone strong{display:block;color:var(--text);font-size:15px;margin-bottom:5px}.dropzone button{margin-top:13px}.bottom{height:76px;flex:none;background:#191b20;border-top:1px solid #343841;display:flex;align-items:center;padding:0 18px;gap:14px}.roundplay{width:42px;height:42px;border-radius:50%;padding:0;background:var(--accent);border-color:var(--accent);color:#171321;font-size:17px}.time{font-variant-numeric:tabular-nums;font-size:12px;min-width:108px}.bottom-spacer{flex:1}.master{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px}.master input{width:90px;accent-color:var(--accent)}.status{font-size:10px;color:var(--mint);min-width:90px}.empty-note{text-align:center;color:var(--muted);font-size:11px;padding:10px}.file-input{display:none}
@media(max-width:650px){.track-sidebar{width:125px}.toolbar{padding:0 8px;gap:5px}.top{padding:0 10px}.toolbar button{padding:7px 8px;font-size:11px}.tool-label,.local{display:none}.bottom{padding:0 9px;gap:8px}.master{display:none}.track-label{padding:11px 7px}.track-actions button{padding:3px 5px}.brand small{display:none}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><div class="logo">≋</div>OpenStudio <small>AUDIO</small></div><div class="topspace"></div><div class="local">LOCAL AUDIO WORKSPACE</div></header>
<div class="toolbar">
 <div class="toolgroup"><button class="primary" id="addAudio">＋ Add audio</button><input class="file-input" id="files" type="file" accept="audio/*,.wav,.mp3,.m4a,.flac,.ogg,.aac" multiple><button id="addTrack">＋ Track</button></div>
 <div class="toolgroup"><span class="tool-label">EDIT</span><button id="split">Split at playhead</button><button id="delete">Delete clip</button></div>
 <div class="toolgroup"><span class="tool-label">ZOOM</span><button id="zoomOut">−</button><input id="zoom" class="zoom" type="range" min="35" max="220" value="90"><button id="zoomIn">＋</button><button id="fit">Fit</button></div>
 <div class="toolgroup"><button id="export" class="primary">Export mix WAV ↓</button></div>
</div>
<div class="workspace"><div class="timeline-shell">
 <aside class="track-sidebar"><div class="sidebar-head">TRACKS</div><div id="trackLabels"></div></aside>
 <main class="timeline-scroll" id="scroll"><div class="timeline-inner" id="inner"><div class="ruler" id="ruler"></div><div id="lanes"></div><div class="playhead" id="playhead"></div></div><div id="empty" class="dropzone"><strong>Your timeline is empty</strong>Import multiple audio files to build layered tracks.<br>Drag clips to arrange them and trim either edge.<br><button class="primary" id="emptyAdd">＋ Import audio files</button></div></main>
</div></div>
<footer class="bottom"><button class="roundplay" id="play" title="Play / pause">▶</button><button id="stop">Stop</button><div class="time" id="clock">00:00.00 / 00:00.00</div><div class="bottom-spacer"></div><div class="status" id="status">Ready</div><label class="master">MASTER <input id="master" type="range" min="0" max="1.5" step=".01" value="1"></label></footer>
</div>
<script>
const $=id=>document.getElementById(id);
let ctx=null,tracks=[],selected=null,px=90,playhead=0,playing=false,raf=0,origin=0,playOrigin=0,sources=[],masterGain=null,drag=null;
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const fmt=s=>{s=Math.max(0,s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(2).padStart(5,'0')};
function audioCtx(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();masterGain=ctx.createGain();masterGain.gain.value=+$('master').value;masterGain.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx}
function duration(){return Math.max(8,...tracks.flatMap(t=>t.clips.map(c=>c.at+c.out-c.in)))}
function trackBy(id){return tracks.find(t=>t.id===id)}
function clipBy(id){for(const t of tracks){const c=t.clips.find(c=>c.id===id);if(c)return{track:t,clip:c}}}
function makeTrack(name='Audio '+(tracks.length+1)){const t={id:uid(),name,clips:[],mute:false};tracks.push(t);return t}
function addBuffer(buffer,name){let t=tracks.find(t=>t.clips.length===0)||makeTrack();const c={id:uid(),name,buffer,in:0,out:buffer.duration,at:0};t.clips.push(c);selected=c.id;render();$('status').textContent='Imported '+name}
function render(){const d=duration(),width=Math.max($('scroll').clientWidth-190,d*px+120);$('inner').style.width=width+'px';$('ruler').innerHTML='';for(let s=0;s<=d+1;s+=Math.max(1,Math.round(80/px))){const el=document.createElement('div');el.className='tick';el.style.left=(s*px)+'px';el.textContent=fmt(s).slice(0,5);$('ruler').append(el)}
$('trackLabels').innerHTML='';$('lanes').innerHTML='';for(const t of tracks){const lab=document.createElement('div');lab.className='track-label';lab.innerHTML='<div class="track-name" title="'+esc(t.name)+'">'+esc(t.name)+'</div><div class="track-sub">'+t.clips.length+' clip'+(t.clips.length===1?'':'s')+'</div><div class="track-actions"><button data-act="mute">'+(t.mute?'Unmute':'Mute')+'</button><button data-act="remove">× Track</button></div>';lab.querySelector('[data-act=mute]').onclick=()=>{t.mute=!t.mute;render()};lab.querySelector('[data-act=remove]').onclick=()=>{stop();tracks=tracks.filter(x=>x!==t);if(selected&& !clipBy(selected))selected=null;render()};$('trackLabels').append(lab);
const lane=document.createElement('div');lane.className='lane';lane.dataset.track=t.id;lane.style.width=width+'px';for(const c of t.clips){const el=document.createElement('div');el.className='clip'+(selected===c.id?' selected':'');el.dataset.clip=c.id;el.style.left=(c.at*px)+'px';el.style.width=Math.max(14,(c.out-c.in)*px)+'px';const can=document.createElement('canvas');can.width=Math.max(1,Math.round((c.out-c.in)*px));can.height=78;drawClipWave(can,c);const title=document.createElement('div');title.className='clip-title';title.textContent=c.name;const l=document.createElement('div');l.className='trim left';const r=document.createElement('div');r.className='trim right';el.append(can,title,l,r);el.onpointerdown=e=>{if(e.target===l||e.target===r)return;selected=c.id;drag={kind:'move',id:c.id,x:e.clientX,at:c.at};el.setPointerCapture(e.pointerId);el.classList.add('selected')};l.onpointerdown=e=>startTrim(e,c,'left',el);r.onpointerdown=e=>startTrim(e,c,'right',el);el.ondblclick=()=>{selected=c.id;render()};lane.append(el)}lane.ondblclick=e=>{if(e.target===lane){playhead=Math.max(0,(e.clientX-lane.getBoundingClientRect().left)/px);updatePlayhead()}};$('lanes').append(lane)}
$('empty').style.display=tracks.some(t=>t.clips.length)?'none':'block';$('playhead').style.left=(playhead*px)+'px';$('playhead').style.height=(38+tracks.length*104)+'px';updateClock()}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function drawClipWave(canvas,c){const g=canvas.getContext('2d'),w=canvas.width,h=canvas.height,buf=c.buffer,rate=buf.sampleRate,from=Math.floor(c.in*rate),to=Math.floor(c.out*rate),data=buf.getChannelData(0),mid=h/2;g.clearRect(0,0,w,h);g.strokeStyle='#c4b6ff';g.globalAlpha=.82;for(let x=0;x<w;x++){const a=from+Math.floor(x/w*(to-from)),b=Math.min(to,from+Math.floor((x+1)/w*(to-from))+1);let lo=1,hi=-1;for(let i=a;i<b;i+=Math.max(1,Math.floor((b-a)/60))){const v=data[i]||0;if(v<lo)lo=v;if(v>hi)hi=v}g.beginPath();g.moveTo(x,mid+lo*mid*.85);g.lineTo(x,mid+hi*mid*.85);g.stroke()}g.globalAlpha=1}
function startTrim(e,c,edge,el){e.preventDefault();e.stopPropagation();selected=c.id;drag={kind:edge,id:c.id,x:e.clientX,at:c.at,in:c.in,out:c.out};el.setPointerCapture(e.pointerId);el.classList.add('selected')}
document.addEventListener('pointermove',e=>{if(!drag)return;const found=clipBy(drag.id);if(!found)return;const c=found.clip,dt=(e.clientX-drag.x)/px;if(drag.kind==='move')c.at=Math.max(0,drag.at+dt);if(drag.kind==='left'){const shift=Math.max(-drag.in,Math.min(drag.out-drag.in-.08,dt));c.in=drag.in+shift;c.at=drag.at+shift}if(drag.kind==='right')c.out=Math.max(c.in+.08,Math.min(c.buffer.duration,drag.out+dt));const el=document.querySelector('[data-clip="'+c.id+'"]');if(el){el.style.left=c.at*px+'px';el.style.width=Math.max(14,(c.out-c.in)*px)+'px';const can=el.querySelector('canvas');can.width=Math.max(1,Math.round((c.out-c.in)*px));drawClipWave(can,c)}updateClock()});
document.addEventListener('pointerup',()=>{if(drag){drag=null;render()}});
function updatePlayhead(){ $('playhead').style.left=(playhead*px)+'px';updateClock()}
function updateClock(){ $('clock').textContent=fmt(playhead)+' / '+fmt(duration())}
function stop(){if(ctx){for(const s of sources){try{s.stop()}catch(e){}}}sources=[];playing=false;cancelAnimationFrame(raf);$('play').textContent='▶'}
function play(){audioCtx();if(playing){stop();return}stop();const end=duration();if(playhead>=end)playhead=0;playOrigin=playhead;origin=ctx.currentTime;for(const t of tracks){if(t.mute)continue;for(const c of t.clips){const clipStart=c.at,clipEnd=c.at+c.out-c.in,from=Math.max(playhead,clipStart);if(clipEnd<=from)continue;const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=c.buffer;s.connect(g);g.connect(masterGain);const offset=c.in+(from-clipStart),when=ctx.currentTime+(from-playhead);s.start(when,offset,c.out-offset);sources.push(s)}}playing=true;$('play').textContent='Ⅱ';const tick=()=>{if(!playing)return;playhead=playOrigin+(ctx.currentTime-origin);updatePlayhead();if(playhead>=end){playhead=end;stop();updatePlayhead();return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
function splitSelected(){const f=selected&&clipBy(selected);if(!f){$('status').textContent='Select a clip first';return}const {track,clip:c}=f,local=playhead-c.at+c.in;if(local<=c.in+.04||local>=c.out-.04){$('status').textContent='Place playhead inside the selected clip';return}const right={...c,id:uid(),name:c.name,at:playhead,in:local};c.out=local;track.clips.push(right);selected=right.id;render()}
async function importFiles(files){if(!files.length)return;audioCtx();for(const file of files){try{const b=await ctx.decodeAudioData(await file.arrayBuffer());addBuffer(b,file.name)}catch(e){$('status').textContent='Could not decode '+file.name}}}
function wavEncode(buffers,seconds){const rate=ctx.sampleRate,ch=2,frames=Math.ceil(seconds*rate),bytes=44+frames*ch*3,ab=new ArrayBuffer(bytes),v=new DataView(ab),str=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};str(0,'RIFF');v.setUint32(4,bytes-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,rate,true);v.setUint32(28,rate*ch*3,true);v.setUint16(32,ch*3,true);v.setUint16(34,24,true);str(36,'data');v.setUint32(40,bytes-44,true);let p=44;for(let i=0;i<frames;i++)for(let k=0;k<2;k++){let x=Math.max(-1,Math.min(1,buffers[k][i]||0)),n=Math.round(x<0?x*8388608:x*8388607);if(n<0)n+=16777216;v.setUint8(p++,n&255);v.setUint8(p++,(n>>8)&255);v.setUint8(p++,(n>>16)&255)}return new Blob([ab],{type:'audio/wav'})}
async function exportMix(){if(!tracks.some(t=>t.clips.length)){ $('status').textContent='Add audio clips first';return}const btn=$('export');btn.disabled=true;$('status').textContent='Rendering full mix…';try{const rate=ctx?ctx.sampleRate:48000,end=duration(),offline=new OfflineAudioContext(2,Math.ceil(end*rate),rate),master=offline.createGain();master.gain.value=+$('master').value;master.connect(offline.destination);for(const t of tracks){if(t.mute)continue;for(const c of t.clips){const s=offline.createBufferSource(),g=offline.createGain();s.buffer=c.buffer;s.connect(g);g.connect(master);s.start(c.at,c.in,c.out-c.in)}}const rendered=await offline.startRendering(),blob=wavEncode([rendered.getChannelData(0),rendered.getChannelData(1)],end),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='openstudio-mix.wav';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='Mix exported · '+(blob.size/1048576).toFixed(1)+' MB'}catch(e){$('status').textContent='Export error: '+e.message}finally{btn.disabled=false}}
$('addAudio').onclick=$('emptyAdd').onclick=()=>$('files').click();$('files').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};$('addTrack').onclick=()=>{makeTrack();render()};$('split').onclick=splitSelected;$('delete').onclick=()=>{const f=selected&&clipBy(selected);if(!f)return;$('status').textContent='Clip removed';f.track.clips=f.track.clips.filter(c=>c.id!==selected);selected=null;render()};$('play').onclick=play;$('stop').onclick=()=>{stop();playhead=0;updatePlayhead()};$('export').onclick=exportMix;$('master').oninput=e=>{if(masterGain)masterGain.gain.value=+e.target.value};$('zoom').oninput=e=>{px=+e.target.value;render()};$('zoomIn').onclick=()=>{$('zoom').value=Math.min(220,px+15);$('zoom').oninput()};$('zoomOut').onclick=()=>{$('zoom').value=Math.max(35,px-15);$('zoom').oninput()};$('fit').onclick=()=>{px=Math.max(35,Math.min(220,($('scroll').clientWidth-220)/duration()));$('zoom').value=px;render()};
$('scroll').addEventListener('pointerdown',e=>{if(e.target.id==='inner'||e.target.id==='ruler'||e.target.classList.contains('tick')){const r=$('inner').getBoundingClientRect();playhead=Math.max(0,(e.clientX-r.left)/px);updatePlayhead()}});
$('scroll').addEventListener('dragover',e=>e.preventDefault());$('scroll').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)importFiles([...e.dataTransfer.files])});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();play()}if(e.key==='Delete'&&selected&&document.activeElement.tagName!=='INPUT')$('delete').click();if(e.key==='ArrowLeft'&&e.target.tagName!=='INPUT'){playhead=Math.max(0,playhead-.1);updatePlayhead()}if(e.key==='ArrowRight'&&e.target.tagName!=='INPUT'){playhead+=.1;updatePlayhead()}});
render();
</script></body></html>
